<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyDash — Design Patterns &amp; Algoritmos</title>
    <meta name="description" content="Dashboard interativo para aprender Design Patterns, Algoritmos, Clean Code e muito mais." />
    <script>
      // Aplica o tema salvo antes do React montar, pra evitar flash do tema errado.
      (function () {
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
